<style>
@font-face{font-family:"Cairo";src:url(__FONT_AR__) format("woff2");font-weight:200 900;font-display:block;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF;}
@font-face{font-family:"Cairo";src:url(__FONT_LAT__) format("woff2");font-weight:200 900;font-display:block;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215;}

:root{
  --dark:#0b0d0f; --dark-soft:#111518; --white:#ffffff; --light:#f6f6f4;
  --gray:#6b7075; --border:#e3e3de; --gold:#c7a76c; --gold-dark:#aa8b52;
}
*{margin:0;padding:0;box-sizing:border-box;}
@page{size:A4;margin:0;}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
body{font-family:"Cairo",sans-serif;color:var(--dark);background:#fff;font-size:10.5pt;line-height:1.75;}

.page{width:210mm;min-height:297mm;padding:17mm 16mm 20mm;position:relative;page-break-after:always;display:flex;flex-direction:column;}
.page:last-child{page-break-after:auto;}

/* ---------- COVER ---------- */
.cover{background:var(--dark);color:var(--white);justify-content:space-between;padding:22mm 16mm;}
.cover::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 85% 12%, rgba(199,167,108,.16), transparent 55%),
  radial-gradient(circle at 10% 90%, rgba(199,167,108,.09), transparent 50%);}
.cover>*{position:relative;z-index:1;}
.cover-logo{width:46mm;filter:brightness(0) invert(1);opacity:.95;}
.cover-kicker{color:var(--gold);letter-spacing:.14em;font-size:9pt;font-weight:700;margin-bottom:6mm;}
.cover h1{font-size:30pt;font-weight:800;line-height:1.35;letter-spacing:-.01em;}
.cover h1 span{color:var(--gold);}
.cover .sub{color:#b9bcbf;font-size:11.5pt;margin-top:5mm;max-width:130mm;line-height:1.9;}
.rule{height:2px;width:26mm;background:var(--gold);margin:8mm 0;}
.cover-meta{display:flex;gap:6mm;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.12);padding-top:7mm;}
.cover-meta div{flex:1;min-width:38mm;}
.cover-meta .lbl{color:var(--gold);font-size:8pt;font-weight:700;letter-spacing:.08em;margin-bottom:1.5mm;}
.cover-meta .val{color:#fff;font-size:10.5pt;font-weight:600;}

/* ---------- SHARED ---------- */
.sec-kicker{color:var(--gold-dark);font-size:8.5pt;font-weight:800;letter-spacing:.1em;margin-bottom:2mm;}
h2{font-size:19pt;font-weight:800;letter-spacing:-.01em;line-height:1.4;}
h2 .num{color:var(--gold);}
h3{font-size:11.5pt;font-weight:800;margin-bottom:2.5mm;}
p{color:#3a3f44;}
.lead{font-size:11pt;color:#4a4f54;margin-top:3mm;line-height:1.95;}
.rng{unicode-bidi:isolate;direction:ltr;}
.hr{height:1px;background:var(--border);margin:7mm 0;}

.note{background:var(--light);border-inline-start:3px solid var(--gold);padding:4mm 5mm;border-radius:2px;font-size:9.5pt;color:#4a4f54;line-height:1.8;}
.note b{color:var(--dark);}

/* feature groups */
.grp{margin-bottom:5mm;break-inside:avoid;}
.grp-h{display:flex;align-items:center;gap:3mm;margin-bottom:2.5mm;}
.grp-h .dot{width:5.5mm;height:5.5mm;border-radius:50%;background:var(--gold);color:#fff;font-size:8pt;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
.grp-h h3{margin:0;font-size:11pt;}
ul{list-style:none;padding-inline-start:8.5mm;}
li{position:relative;font-size:9.8pt;color:#41464b;line-height:1.72;margin-bottom:1.4mm;}
li::before{content:"";position:absolute;inset-inline-start:-5mm;top:2.6mm;width:1.8mm;height:1.8mm;border-radius:50%;background:var(--gold);opacity:.75;}
li b{color:var(--dark);font-weight:700;}

/* price card */
.price{margin-top:auto;background:var(--dark);color:#fff;border-radius:3px;padding:6mm 7mm;display:flex;align-items:center;justify-content:space-between;gap:6mm;break-inside:avoid;}
.price .l .lbl{color:var(--gold);font-size:8.5pt;font-weight:700;letter-spacing:.08em;}
.price .l .amt{font-size:23pt;font-weight:800;line-height:1.3;}
.price .l .amt small{font-size:11pt;font-weight:600;color:#c9ccce;}
.price .r{text-align:end;border-inline-start:1px solid rgba(255,255,255,.14);padding-inline-start:6mm;}
.price .r div{font-size:9pt;color:#b9bcbf;margin-bottom:1mm;}
.price .r b{color:#fff;font-weight:700;}

.badge{display:inline-block;background:rgba(199,167,108,.14);color:var(--gold-dark);border:1px solid rgba(199,167,108,.4);
  border-radius:20px;padding:1mm 4mm;font-size:8.5pt;font-weight:700;margin-bottom:3mm;align-self:flex-start;}

/* table */
table{width:100%;border-collapse:collapse;font-size:9.2pt;margin-top:2mm;}
th,td{padding:2.15mm 3mm;border-bottom:1px solid var(--border);text-align:start;}
thead th{background:var(--dark);color:#fff;font-weight:700;font-size:9pt;}
thead th:not(:first-child){text-align:center;}
tbody td:not(:first-child){text-align:center;}
tbody tr:nth-child(even){background:#fafaf8;}
td.y{color:var(--gold-dark);font-weight:800;}
td.n{color:#b9bcbc;}
tfoot td{background:var(--light);font-weight:800;color:var(--dark);font-size:10.5pt;border-top:2px solid var(--gold);}

.cols{columns:2;column-gap:8mm;}
.cols .grp{break-inside:avoid;margin-bottom:4.5mm;}
.cols li{font-size:9.2pt;line-height:1.66;}
.cols .grp-h h3{font-size:10.3pt;}
.two{display:flex;gap:6mm;}
.two>div{flex:1;}
.box{border:1px solid var(--border);border-radius:3px;padding:5mm;break-inside:avoid;}
.box h3{color:var(--gold-dark);font-size:10pt;}

.foot{position:absolute;bottom:9mm;inset-inline:16mm;display:flex;justify-content:space-between;
  font-size:8pt;color:#9aa0a5;border-top:1px solid var(--border);padding-top:3mm;}
.cmp{font-size:8.4pt;}
.cmp th,.cmp td{padding:1.85mm 1.6mm;}
.cmp td:first-child{font-size:8.6pt;}
.cmp tfoot td{font-size:9.3pt;}
.price .r div{font-size:8.6pt;}
</style>
