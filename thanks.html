<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>تم إرسال طلبك | الصديق جروب</title>
    <style>
        *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#080a0c;color:#f4f1e9;font-family:Tahoma,Arial,sans-serif;text-align:center}.message{max-width:520px;padding:40px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:#111518}.message h1{margin:0 0 12px;color:#c7a76c;font-size:30px}.message p{margin:0 0 24px;color:#b7b9ba}.message a{display:inline-block;padding:12px 22px;border-radius:7px;background:#c7a76c;color:#111;text-decoration:none;font-weight:700}
    </style>
    <script>
        window.setTimeout(() => {
            window.location.replace("/?submitted=true");
        }, 2000);
    </script>
</head>
<body>
    <main class="message">
        <h1>تم إرسال طلبك بنجاح</h1>
        <p>سيتم إعادتك إلى موقع الصديق جروب خلال ثانيتين.</p>
        <a href="/?submitted=true">العودة إلى الموقع</a>
    </main>
</body>
</html>
